<html lang="ru" data-theme="ios" data-color="yellow">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Верити</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="main-header">

        <div class="header-info">
            <h1 id="header-title">Верити</h1>
            <div class="status">онлайн</div>
        </div>

        <div class="header-controls">

            <!-- ДИЗАЙН -->
            <select
                class="theme-select"
                onchange="changeTheme(this.value)"
            >
                <option value="ios">Дизайн: iOS</option>
                <option value="cyberpunk">Дизайн: Простой</option>
                <option value="microsoft">Дизайн: Windows</option>
            </select>

            <!-- ЦВЕТ -->
            <select
                class="color-select"
                onchange="changeColor(this.value)"
            >
                <option value="yellow">🟡</option>
                <option value="blue">🔵</option>
                <option value="green">🟢</option>
            </select>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ ПОЛЯ ВВОДА -->
            <label
                class="input-switch"
                title="Показывать поле ввода"
            >
                <input
                    type="checkbox"
                    id="input-toggle"
                    checked
                    onchange="toggleInput()"
                >

                <span class="switch-slider"></span>
            </label>

        </div>

    </div>


    <div id="chat-window">

        <!-- ПЕРВОЕ СООБЩЕНИЕ -->
        <div class="message bot">
            Че надо, бездарь? Спрашивай свою глупость, я жду.
        </div>

    </div>


    <div id="input-panel">

        <div class="input-container">

            <input
                type="text"
                id="user-input"
                placeholder="Напиши что-нибудь..."
                autocomplete="off"
            >

            <button id="send-btn">

                <svg
                    viewBox="0 0 24 24"
                    style="width:16px; height:16px; fill:currentColor;"
                >
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>

            </button>

        </div>

    </div>


    <script>

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        const inputPanel = document.getElementById('input-panel');
        const inputToggle = document.getElementById('input-toggle');


        /* =========================
           СМЕНА ДИЗАЙНА
           ========================= */

        function changeTheme(t) {

            document.documentElement.setAttribute(
                'data-theme',
                t
            );

            const title =
                document.getElementById('header-title');

            title.innerText =
                t === 'ios'
                    ? "Верити"
                    : t === 'cyberpunk'
                    ? "ВЕРИТИ // ПРОСТОЙ"
                    : "Верити OS";

            scrollToBottom();
        }


        /* =========================
           СМЕНА ЦВЕТА
           ========================= */

        function changeColor(color) {

            document.documentElement.setAttribute(
                'data-color',
                color
            );

        }


        /* =========================
           ПОЛЕ ВВОДА
           ========================= */

        function toggleInput() {

            const hidden = !inputToggle.checked;

            inputPanel.classList.toggle(
                'input-hidden',
                hidden
            );

            document.body.classList.toggle(
                'input-off',
                hidden
            );

            scrollToBottom();
        }


        /* =========================
           СКРОЛЛ
           ========================= */

        function scrollToBottom() {

            setTimeout(() => {

                chatWindow.scrollTop =
                    chatWindow.scrollHeight;

            }, 50);

        }


        /* =========================
           ДОБАВЛЕНИЕ СООБЩЕНИЯ
           ========================= */

        function appendMessage(
            text,
            sender,
            isSystem = false
        ) {

            const message =
                document.createElement('div');

            message.classList.add(
                'message',
                sender
            );

            if (isSystem) {

                message.classList.add(
                    'system-status'
                );

            }

            message.innerText = text;

            chatWindow.appendChild(message);

            scrollToBottom();

            return message;
        }


        /* =========================
           ОТПРАВКА
           ========================= */

        async function sendMessage() {

            const text =
                userInput.value.trim();

            if (!text) return;


            appendMessage(
                text,
                'user'
            );

            userInput.value = '';


            const typing =
                appendMessage(
                    "Верити печатает...",
                    'bot',
                    true
                );


            try {

                const response =
                    await fetch(
                        '/ask',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                message: text
                            })
                        }
                    );


                const data =
                    await response.json();


                typing.classList.remove(
                    'system-status'
                );

                typing.innerText =
                    data.reply;


                scrollToBottom();


            } catch {

                typing.classList.remove(
                    'system-status'
                );

                typing.innerText =
                    "Ошибка соединения.";

                scrollToBottom();

            }

        }


        sendBtn
