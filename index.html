<!DOCTYPE html>
<html lang="ru" data-theme="ios">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Верити</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="main-header">
        <div class="header-info"><h1 id="header-title">Верити</h1><div class="status">онлайн</div></div>
        <select class="theme-select" onchange="changeTheme(this.value)">
            <option value="ios">Дизайн: iOS</option>
            <option value="cyberpunk">Дизайн: Простой</option>
            <option value="microsoft">Дизайн: Windows</option>
        </select>
    </div>
    <div id="chat-window"><div class="message bot">Че надо, бездарь? Спрашивай свою глупость, я жду.</div></div>
    <div id="input-panel">
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Напиши что-нибудь..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>
    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        function changeTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            const title = document.getElementById('header-title');
            title.innerText = t === 'ios' ? "Верити" : t === 'cyberpunk' ? "ВЕРИТИ // ПРОСТОЙ" : "Верити OS";
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        function appendMessage(t, s, isS = false) {
            const m = document.createElement('div');
            m.classList.add('message', s);
            if (isS) m.classList.add('system-status');
            m.innerText = t;
            chatWindow.appendChild(m);
            setTimeout(() => { chatWindow.scrollTop = chatWindow.scrollHeight; }, 30);
            return m;
        }
        async function sendMessage() {
            const t = userInput.value.trim();
            if (!t) return;
            appendMessage(t, 'user');
            userInput.value = '';
            const typing = appendMessage("Верити печатает...", 'bot', true);
            try {
                const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: t }) });
                const d = await r.json();
                typing.classList.remove('system-status');
                typing.innerText = d.reply;
            } catch {
                typing.classList.remove('system-status');
                typing.innerText = "Ошибка соединения.";
            }
        }
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
