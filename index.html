<!DOCTYPE html><html lang="ru" data-theme="ios" data-color="yellow"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Верити</title>

<link rel="stylesheet" href="/static/style.css">

<style>
    .thinking-toggle {
        display: block;
        margin-top: 7px;
        padding: 6px 11px;
        border: 1px solid #777;
        border-radius: 12px;
        background: #292929;
        color: #fff;
        font-size: 12px;
        cursor: pointer;
    }

    .thinking-toggle:active {
        opacity: 0.7;
    }

    .thinking-box {
        display: none;
        margin-top: 7px;
        padding: 10px;
        border-radius: 12px;
        background: #242424;
        color: #ddd;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .thinking-box.open {
        display: block;
    }

    .bot-response {
        max-width: 78%;
        align-self: flex-start;
    }

    .bot-response .message {
        max-width: 100%;
    }
</style>

</head><body><div class="main-header">

    <div class="header-info">
        <h1 id="header-title">Верити</h1>
        <div class="status">онлайн</div>
    </div>

    <div class="header-controls">

        <select
            class="theme-select"
            onchange="changeTheme(this.value)"
        >
            <option value="ios">Дизайн: iOS</option>
            <option value="cyberpunk">Дизайн: Простой</option>
            <option value="microsoft">Дизайн: Windows</option>
        </select>

        <select
            class="color-select"
            onchange="changeColor(this.value)"
        >
            <option value="yellow">🟡</option>
            <option value="blue">🔵</option>
            <option value="green">🟢</option>
        </select>

        <label
            class="input-switch"
            title="Показывать поле ввода"
        >
            <input
                type="checkbox"
                id="input-toggle"
                checked
                onchange="toggleInput()"
            >
            <span class="switch-slider"></span>
        </label>

    </div>
</div>


<div id="chat-window">

    <div class="message bot">
        Че надо, бездарь? Спрашивай свою глупость, я жду.
    </div>

</div>


<div id="input-panel">

    <div class="input-container">

        <input
            type="text"
            id="user-input"
            placeholder="Напиши что-нибудь..."
            autocomplete="off"
        >

        <button id="send-btn">

            <svg
                viewBox="0 0 24 24"
                style="width:16px;height:16px;fill:currentColor;"
            >
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z">
                </path>
            </svg>

        </button>

    </div>

</div>


<script>

    const chatWindow =
        document.getElementById('chat-window');

    const userInput =
        document.getElementById('user-input');

    const sendBtn =
        document.getElementById('send-btn');

    const inputPanel =
        document.getElementById('input-panel');

    const inputToggle =
        document.getElementById('input-toggle');


    function changeTheme(theme) {

        document.documentElement
            .setAttribute('data-theme', theme);

        const title =
            document.getElementById('header-title');

        if (theme === 'ios') {

            title.innerText = 'Верити';

        } else if (theme === 'cyberpunk') {

            title.innerText = 'ВЕРИТИ // ПРОСТОЙ';

        } else {

            title.innerText = 'Верити OS';

        }

        scrollToBottom();
    }


    function changeColor(color) {

        document.documentElement
            .setAttribute('data-color', color);

    }


    function toggleInput() {

        const hidden =
            !inputToggle.checked;

        inputPanel.classList.toggle(
            'input-hidden',
            hidden
        );

        document.body.classList.toggle(
            'input-off',
            hidden
        );

        scrollToBottom();
    }


    function scrollToBottom() {

        setTimeout(() => {

            chatWindow.scrollTop =
                chatWindow.scrollHeight;

        }, 50);

    }


    function appendMessage(
        text,
        sender,
        isSystem = false
    ) {

        const message =
            document.createElement('div');

        message.classList.add(
            'message',
            sender
        );

        if (isSystem) {

            message.classList.add(
                'system-status'
            );

        }

        message.innerText = text;

        chatWindow.appendChild(message);

        scrollToBottom();

        return message;
    }


    // Создание объяснения без изменения app.py
    function createExplanation(
        userText,
        botText
    ) {

        const shortUser =
            userText.length > 100
                ? userText.substring(0, 100) + '...'
                : userText;

        const shortBot =
            botText.length > 160
                ? botText.substring(0, 160) + '...'
                : botText;

        return (
            'Верити получила сообщение: "' +
            shortUser +
            '"\n\n' +
            'Ответ был сформирован на основе этого запроса.\n\n' +
            'Ответ Верити: "' +
            shortBot +
            '"'
        );
    }


    function addBotResponse(
        text,
        userText
    ) {

        const wrapper =
            document.createElement('div');

        wrapper.className =
            'bot-response';


        const message =
            document.createElement('div');

        message.className =
            'message bot';

        message.innerText = text;

        wrapper.appendChild(message);


        const button =
            document.createElement('button');

        button.className =
            'thinking-toggle';

        button.type = 'button';

        button.innerText =
            '🧠 Размышление';


        const thinking =
            document.createElement('div');

        thinking.className =
            'thinking-box';

        thinking.innerText =
            createExplanation(
                userText,
                text
            );


        button.addEventListener(
            'click',
            () => {

                const opened =
                    thinking.classList.toggle('open');

                button.innerText =
                    opened
                        ? '🧠 Скрыть размышление'
                        : '🧠 Размышление';

                scrollToBottom();

            }
        );


        wrapper.appendChild(button);

        wrapper.appendChild(thinking);

        chatWindow.appendChild(wrapper);

        scrollToBottom();
    }


    async function sendMessage() {

        const text =
            userInput.value.trim();

        if (!text) return;


        appendMessage(
            text,
            'user'
        );

        userInput.value = '';


        const typing =
            appendMessage(
                'Верити печатает...',
                'bot',
                true
            );


        try {

            const response =
                await fetch(
                    '/ask',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify({
                                message: text
                            })
                    }
                );


            const data =
                await response.json();


            typing.remove();


            if (!response.ok) {

                appendMessage(
                    data.reply ||
                    'Ошибка сервера.',
                    'bot'
                );

                return;
            }


            addBotResponse(
                data.reply ||
                'Модель не прислала ответ 😭',
                text
            );


        } catch (error) {

            console.error(error);

            typing.remove();

            appendMessage(
                'Ошибка соединения.',
                'bot'
            );

        }
    }


    sendBtn.addEventListener(
        'click',
        sendMessage
    );


    userInput.addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Enter') {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    changeTheme('ios');
    changeColor('yellow');

</script>

</body>
</html>
