<html lang="ru" data-theme="ios" data-color="yellow">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Верити</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- ШАПКА -->
    <div class="main-header">

        <div class="header-info">
            <h1 id="header-title">Верити</h1>
            <div class="status">онлайн</div>
        </div>

        <div class="header-controls">

            <!-- ВЫБОР ДИЗАЙНА -->
            <select
                class="theme-select"
                onchange="changeTheme(this.value)"
            >
                <option value="ios">Дизайн: iOS</option>
                <option value="cyberpunk">Дизайн: Простой</option>
                <option value="microsoft">Дизайн: Windows</option>
            </select>

            <!-- ВЫБОР ЦВЕТА -->
            <select
                class="color-select"
                onchange="changeColor(this.value)"
            >
                <option value="yellow">🟡</option>
                <option value="blue">🔵</option>
                <option value="green">🟢</option>
            </select>

            <!-- ПЕРЕКЛЮЧАТЕЛЬ ПОЛЯ ВВОДА -->
            <label
                class="input-switch"
                title="Показывать поле ввода"
            >
                <input
                    type="checkbox"
                    id="input-toggle"
                    checked
                    onchange="toggleInput()"
                >

                <span class="switch-slider"></span>
            </label>

        </div>

    </div>


    <!-- ЧАТ -->
    <div id="chat-window">

        <div class="message bot">
            Че надо, бездарь? Спрашивай свою глупость, я жду.
        </div>

    </div>


    <!-- ПОЛЕ ВВОДА -->
    <div id="input-panel">

        <div class="input-container">

            <input
                type="text"
                id="user-input"
                placeholder="Напиши что-нибудь..."
                autocomplete="off"
            >

            <button id="send-btn">

                <svg
                    viewBox="0 0 24 24"
                    style="width:16px; height:16px; fill:currentColor;"
                >
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>

            </button>

        </div>

    </div>


    <script>

        const chatWindow =
            document.getElementById('chat-window');

        const userInput =
            document.getElementById('user-input');

        const sendBtn =
            document.getElementById('send-btn');

        const inputPanel =
            document.getElementById('input-panel');

        const inputToggle =
            document.getElementById('input-toggle');


        /* =========================
           СМЕНА ДИЗАЙНА
           ========================= */

        function changeTheme(theme) {

            document.documentElement.setAttribute(
                'data-theme',
                theme
            );

            const title =
                document.getElementById('header-title');

            if (theme === 'ios') {

                title.innerText = 'Верити';

            } else if (theme === 'cyberpunk') {

                title.innerText = 'ВЕРИТИ // ПРОСТОЙ';

            } else {

                title.innerText = 'Верити OS';

            }

            scrollToBottom();
        }


        /* =========================
           СМЕНА ЦВЕТА
           ========================= */

        function changeColor(color) {

            document.documentElement.setAttribute(
                'data-color',
                color
            );

        }


        /* =========================
           ПОКАЗАТЬ / СКРЫТЬ ПОЛЕ
           ========================= */

        function toggleInput() {

            const hidden =
                !inputToggle.checked;

            inputPanel.classList.toggle(
                'input-hidden',
                hidden
            );

            document.body.classList.toggle(
                'input-off',
                hidden
            );

            scrollToBottom();
        }


        /* =========================
           СКРОЛЛ ВНИЗ
           ========================= */

        function scrollToBottom() {

            setTimeout(() => {

                chatWindow.scrollTop =
                    chatWindow.scrollHeight;

            }, 50);

        }


        /* =========================
           ДОБАВЛЕНИЕ СООБЩЕНИЯ
           ========================= */

        function appendMessage(
            text,
            sender,
            isSystem = false
        ) {

            const message =
                document.createElement('div');

            message.classList.add(
                'message',
                sender
            );

            if (isSystem) {

                message.classList.add(
                    'system-status'
                );

            }

            message.innerText = text;

            chatWindow.appendChild(message);

            scrollToBottom();

            return message;
        }


        /* =========================
           ОТПРАВКА СООБЩЕНИЯ
           ========================= */

        async function sendMessage() {

            const text =
                userInput.value.trim();

            if (!text) {
                return;
            }


            // Сообщение пользователя
            appendMessage(
                text,
                'user'
            );

            userInput.value = '';


            // "Верити печатает..."
            const typing =
                appendMessage(
                    'Верити печатает...',
                    'bot',
                    true
                );


            try {

                const response =
                    await fetch(
                        '/ask',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                message: text
                            })
                        }
                    );


                const data =
                    await response.json();


                // Убираем статус
                typing.classList.remove(
                    'system-status'
                );


                // Ответ Верити
                typing.innerText =
                    data.reply ||
                    'Модель не прислала ответ 😭';


                scrollToBottom();


            } catch (error) {

                console.error(error);

                typing.classList.remove(
                    'system-status'
                );

                typing.innerText =
                    'Ошибка соединения.';


                scrollToBottom();

            }

        }


        /* =========================
           КНОПКА ОТПРАВКИ
           ========================= */

        sendBtn.addEventListener(
            'click',
            sendMessage
        );


        /* =========================
           ENTER
           ========================= */

        userInput.addEventListener(
            'keydown',
            function(event) {

                if (event.key === 'Enter') {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =========================
           СТАРТОВОЕ СОСТОЯНИЕ
           ========================= */

        changeTheme('ios');

        changeColor('yellow');

    </script>

</body>
</html>
